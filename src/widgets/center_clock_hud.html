<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Center Monitor - Minimal Clock & Audio Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            background: transparent;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #EAF0EC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .clock-container {
            font-size: 110px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #EAF0EC;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .date-container {
            font-size: 28px;
            color: #8A9A86;
            margin-top: -10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .visualizer {
            display: flex;
            gap: 6px;
            height: 60px;
            margin-top: 40px;
            align-items: flex-end;
        }
        .v-bar {
            width: 8px;
            height: 10px;
            background: linear-gradient(180deg, #F4A261, #8A9A86);
            border-radius: 4px;
            transition: height 0.05s ease;
        }
    </style>
</head>
<body>
    <div class="clock-container" id="clock">12:00:00</div>
    <div class="date-container" id="date">Wednesday, August 28</div>

    <div class="visualizer" id="visualizer">
        <!-- Bars dynamically updated by engine -->
        <div class="v-bar" style="height: 20px;"></div>
        <div class="v-bar" style="height: 35px;"></div>
        <div class="v-bar" style="height: 50px;"></div>
        <div class="v-bar" style="height: 25px;"></div>
        <div class="v-bar" style="height: 40px;"></div>
    </div>
</body>
</html>
